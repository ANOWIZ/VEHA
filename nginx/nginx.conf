# Reverse proxy для production. Фронт — статика из nginx-контейнера фронта,
# здесь маршрутизируем /api на backend и проксируем остальное на frontend.
upstream backend {
    server backend:8000;
}
upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /docs { proxy_pass http://backend; }
    location /openapi.json { proxy_pass http://backend; }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
    }
}
